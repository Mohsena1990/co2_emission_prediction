  # ---- 10 NESO electricity-grid quarterly features (spec section 7) - the
  # final 12-item grid block (spec section 9) is these 10 plus the 2
  # OWID_*_L1Y columns below. ----
  # Source: GB National Grid ESO Carbon Intensity API
  # (api.carbonintensity.org.uk), half-hourly, available from 2018-01-01
  # (src/grid/fetch.py::EARLIEST_AVAILABLE_DATE). These describe the GB
  # ELECTRICITY SYSTEM's carbon intensity and generation mix - external
  # predictors, not a re-measurement of total UK CO2e (which covers all
  # sectors). Aggregated to quarterly by src/grid/aggregate.py; a quarter is
  # excluded entirely (dropped from A3/A4, not imputed) if its half-hourly
  # completeness ratio falls below `grid.minimum_quarter_completeness`
  # (spec 6.3) - so A3/A4 can have fewer rows than A1/A2 even within the
  # grid-covered period. Treated as lag-0 exogenous features safe at every
  # horizon under the same documented convention already used for the raw
  # macro predictors above (GDP/etc.): the quarterly aggregate is only
  # computable once the quarter completes, which coincides with the
  # forecast origin itself, and generation-mix/intensity readings are
  # published near-real-time (far less delayed than GDP's real publication
  # lag) - see the header note on safe_at_h{1,2,4} semantics. Column names
  # here use this codebase's existing snake_case convention rather than
  # spec section 7's exact CamelCase spelling (e.g. Grid_CI_high_share vs.
  # "Grid_HighIntensityShare") - same features, documented mapping in the
  # final report rather than a purely cosmetic rename across the codebase.
  # Aggregated as unweighted means of half-hourly percentages, NOT
  # generation-weighted totals (spec 7.2's preference) - the Carbon
  # Intensity API exposes generation-mix shares only, not absolute
  # generation volumes, so true generation-weighting isn't computable from
  # this source; documented simplification, same class as the "no
  # demand-weighted CI" limitation already noted for Grid_CI_* above.

  - name: Grid_CI_mean
    family: grid_exogenous
    kind: raw
    formula: "mean(CI_t for t in quarter q)"
    source_variables: [intensity_actual, intensity_forecast]
    target_derived: false
    min_lag: 0
    availability_category: exogenous_and_observable
    release_delay_quarters: 0
    leakage_risk: none
    safe_at_h1: true
    safe_at_h2: true
    safe_at_h4: true
    missing_value_rule: quarter_dropped_if_incomplete
    retained_after_audit: true
    exclusion_reason: null
    role: both
    configuration_membership: [A3, A4]

  - name: Grid_CI_p90
    family: grid_exogenous
    kind: raw
    formula: "P90(CI_t for t in quarter q)"
