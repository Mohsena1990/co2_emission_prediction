# Q-DECEM predictor-governance registry (spec section 5).
#
# This is the single source of truth for every raw and engineered candidate
# predictor considered by the pipeline. It is consulted by
# src/features/registry.py BEFORE any model matrix is constructed:
# `enforce_availability_registry: true` (see FeatureConfig) means a feature
# absent from this file, or marked retained_after_audit: false for the
# requested horizon, cannot enter X.
#
# Column semantics:
#   name                    - feature/column name as produced by
#                             src/features/engineering.py
#   family                  - raw_exogenous | target_lag | target_growth |
#                             target_intensity | weather | seasonal |
#                             disruption | exogenous_growth
#   kind                    - raw | engineered
#   formula                 - mathematical definition
#   source_variables        - upstream raw column(s) this is derived from
#   target_derived          - true if the feature is a function of CO2e
#                             (directly or via a target-derived input)
#   min_lag                 - minimum number of quarters between the origin
#                             t and the most recent input the feature uses;
#                             0 means "as of the origin quarter itself"
#   availability_category   - exogenous_and_observable |
#                             exogenous_with_publication_delay |
#                             historical_target_derived |
#                             contemporaneous_target_derived |
#                             deterministic_calendar |
#                             event_or_regime_indicator |
#                             unavailable_at_forecast_origin
#   release_delay_quarters  - assumed publication delay for raw exogenous
#                             series (0 if effectively immediate/backfilled)
#   leakage_risk            - none | low | moderate | high
#   safe_at_h1 / safe_at_h2 / safe_at_h4 - whether the feature (as
#                             constructed, at its stated min_lag) can be used
#                             for a direct forecast at that horizon without
#                             using information unavailable at the origin.
#                             A feature with min_lag m is safe at horizon h
#                             whenever m >= 1 (the direct-target construction
#                             in create_direct_horizon_targets already
#                             handles the horizon offset on the TARGET side;
#                             the FEATURE only needs to avoid using CO2e_t or
#                             later, i.e. min_lag >= 1). Raw exogenous
#                             features with min_lag=0 are flagged not-safe at
#                             any horizon under a strict origin-availability
#                             reading and are governed via
#                             release_delay_quarters instead (documented
#                             simplification - see final report).
#   missing_value_rule      - how NaNs (e.g. lag warm-up rows) are handled
#   retained_after_audit    - whether this feature is allowed into ANY
#                             governed family / FS candidate pool by default
#   exclusion_reason        - populated when retained_after_audit is false,
#                             or when only a lagged/derived variant is safe
#   role                    - forecasting | explanatory | both

features:
  # ---- 5 raw predictors (spec section 3: TEC/CEI fully removed, not just
  # opt-in-excluded - see the removed-variable audit trail in the final
  # report). Google mobility-shock predictors are added separately once
  # ingested (spec section 4). ----
  - name: GDP
    family: raw_exogenous
    kind: raw
    formula: "GDP_t (raw level, £bn)"
    source_variables: [GDP]
    target_derived: false
    min_lag: 0
    availability_category: exogenous_with_publication_delay
    release_delay_quarters: 1
    leakage_risk: low
    safe_at_h1: true
    safe_at_h2: true
    safe_at_h4: true
    missing_value_rule: none_observed
    retained_after_audit: true
    exclusion_reason: null
    role: both
    configuration_membership: [A1, A2, A3, A4]

