version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Version bumps land as PRs, not auto-merges - the CI workflow
    # (.github/workflows/tests.yml) runs the full pytest suite including
    # leakage/nested-CV isolation checks against each one before it's
    # trusted, given how sensitive this pipeline's reproducibility is to
    # exact pinned versions (see requirements.txt's own comment on this).

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
