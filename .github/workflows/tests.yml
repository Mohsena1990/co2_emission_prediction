name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the CPU-only torch build first: the default PyPI wheel
          # pulls in the full CUDA toolkit (nvidia-cublas/cudnn/cusolver/...,
          # several GB combined), which exhausts the GitHub-hosted runner's
          # disk before the rest of requirements.txt can install - CI never
          # uses a GPU, so there is no reason to pay that cost here. Pinned
          # to the same torch version as requirements.txt; installing it
          # first satisfies that pin so the subsequent requirements.txt
          # install does not re-fetch the CUDA build.
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v --durations=20 --cov=src --cov-report=term-missing --cov-report=xml

      - name: Leakage and nested-CV isolation checks
        run: |
          pytest tests/test_leakage_sentinel.py tests/test_no_leakage.py \
                 tests/test_nested_cv_isolation.py tests/test_pso_isolation.py \
                 tests/test_feature_leakage_fixes.py -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30
