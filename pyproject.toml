[project]
name = "qdecem-co2-forecast"
version = "0.6.0"
description = "Q-DECEM: leakage-controlled quarterly UK CO2e forecasting framework (predictor governance, feature selection, PSO-tuned models, Pareto/MCDA selection)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "lightgbm==4.6.0",
    "catboost==1.2.8",
    "xgboost==3.1.3",
    "torch==2.14.0",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "shap==0.49.1",
    "statsmodels==0.14.6",
    "openpyxl==3.1.5",
    "pyarrow==23.0.0",
    "PyYAML==6.0.3",
    "tqdm==4.67.1",
    "joblib==1.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.qdecem]
# Deterministic seeds used throughout the pipeline (spec 3.8) - the single
# source of truth referenced by Config.seed / config/*.yaml defaults.
default_seed = 42
